name: DSE Scraper

on:
  schedule:
    - cron: "15,30,45 4 * * 0,1,2,3,4"   # 10:15, 10:30, 10:45 BD (04:xx UTC)
    - cron: "0,15,30,45 5 * * 0,1,2,3,4" # 11:00–11:45 BD (05:xx UTC)
    - cron: "0,15,30,45 6 * * 0,1,2,3,4" # 12:00–12:45 BD (06:xx UTC)
    - cron: "0,15,30,45 7 * * 0,1,2,3,4" # 01:00–01:45 BD (07:xx UTC)
    - cron: "0 8 * * 0,1,2,3,4"          # 02:00 PM BD (08:00 UTC)
  workflow_dispatch:          # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas lxml

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push output.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/output.json
          git diff --cached --quiet || git commit -m "chore: update DSE data [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
